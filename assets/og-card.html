<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>Open Mic — social preview</title>
<link rel="stylesheet" href="site.css?v=25">
<style>
  /* Render at 1200 × 630, light mode, with ?lang=ja for the Japanese card. */
  :root { color-scheme: light; --bg: #f7f8f5; --paper: #fff; --ink: #171b18; --muted: #656c66; --green: #38651f; }
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body { display: grid; grid-template-columns: 1fr 450px; align-items: center; gap: 58px; padding: 52px 60px; }
  .brand { margin-bottom: 42px; font-size: 30px; }
  h1 { font-size: 78px; margin-bottom: 30px; }
  :lang(ja) h1 { font-size: 63px; }
  .meta { font-size: 13px; }
  .signal { padding: 24px; }
</style>
</head>
<body>
<div>
  <div class="brand"><span class="signal-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Open Mic</div>
  <h1 id="headline">Your voice.<br><span class="soft">Your Mac.</span><br><span class="highlight">One input.</span></h1>
  <p class="meta" id="info">Free / macOS 14.2+ / No account</p>
</div>
<figure class="signal" aria-label="Signal path: your microphone and Mac audio combine into the Open Mic virtual microphone, which your audio app receives as one input.">
      <div class="signal-top"><span>SIGNAL PATH / 001</span><span class="indicator">2 IN → 1 OUT</span></div>
      <div class="channels">
        <div class="channel"><div class="channel-label"><span>Your microphone</span><small>INPUT 01</small></div><div class="wave" aria-hidden="true"><i style="--h:10px"></i><i style="--h:16px"></i><i style="--h:8px"></i><i style="--h:24px"></i><i style="--h:18px"></i><i style="--h:36px"></i><i style="--h:22px"></i><i style="--h:46px"></i><i style="--h:32px"></i><i style="--h:20px"></i><i style="--h:40px"></i><i style="--h:26px"></i><i style="--h:16px"></i><i style="--h:30px"></i><i style="--h:44px"></i><i style="--h:20px"></i><i style="--h:36px"></i><i style="--h:14px"></i><i style="--h:24px"></i><i style="--h:38px"></i><i style="--h:18px"></i><i style="--h:28px"></i><i style="--h:12px"></i><i style="--h:22px"></i><i style="--h:8px"></i><i style="--h:16px"></i><i style="--h:28px"></i><i style="--h:42px"></i><i style="--h:24px"></i><i style="--h:14px"></i><i style="--h:34px"></i><i style="--h:18px"></i><i style="--h:10px"></i><i style="--h:20px"></i><i style="--h:30px"></i><i style="--h:14px"></i></div></div>
        <div class="channel system"><div class="channel-label"><span>Your Mac’s audio</span><small>INPUT 02</small></div><div class="wave" aria-hidden="true"><i style="--h:26px"></i><i style="--h:16px"></i><i style="--h:30px"></i><i style="--h:44px"></i><i style="--h:20px"></i><i style="--h:36px"></i><i style="--h:14px"></i><i style="--h:24px"></i><i style="--h:38px"></i><i style="--h:18px"></i><i style="--h:28px"></i><i style="--h:12px"></i><i style="--h:22px"></i><i style="--h:8px"></i><i style="--h:16px"></i><i style="--h:28px"></i><i style="--h:42px"></i><i style="--h:24px"></i><i style="--h:14px"></i><i style="--h:34px"></i><i style="--h:18px"></i><i style="--h:10px"></i><i style="--h:20px"></i><i style="--h:30px"></i><i style="--h:14px"></i><i style="--h:10px"></i><i style="--h:16px"></i><i style="--h:8px"></i><i style="--h:24px"></i><i style="--h:18px"></i><i style="--h:36px"></i><i style="--h:22px"></i><i style="--h:46px"></i><i style="--h:32px"></i><i style="--h:20px"></i><i style="--h:40px"></i></div></div>
      </div>
      <div class="junction" aria-hidden="true"></div>
      <div class="output"><span class="signal-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><div><strong>Open Mic</strong><small>One virtual microphone</small></div><span class="out-arrow" aria-hidden="true">↗</span></div>
      <figcaption class="signal-bottom"><span>TO YOUR TRANSCRIPTION TOOL / AI APP</span><span>SIGNAL ILLUSTRATION</span></figcaption>
    </figure>
<script>
  const japanese = new URLSearchParams(location.search).get("lang") === "ja";
  if (japanese) {
    document.documentElement.lang = "ja";
    document.getElementById("headline").innerHTML = 'マイクの声も、<br><span class="soft">Macの音も。</span><br><span class="highlight">ひとつに。</span>';
    document.getElementById("info").textContent = "無料 / macOS 14.2以降 / アカウント不要";
    document.querySelector(".channel-label span").textContent = "マイクの声";
    document.querySelector(".system .channel-label span").textContent = "Macの音";
    document.querySelector(".output small").textContent = "ひとつの仮想マイク";
    document.querySelector(".signal-bottom span").textContent = "文字起こしツール / AIアプリへ";
    document.querySelector(".signal-bottom span:last-child").textContent = "音声フローのイメージ";
    document.querySelector(".signal").setAttribute("aria-label", "マイクとMacの音を、ひとつの仮想マイクにミックス");
  }
</script>
</body>
</html>
